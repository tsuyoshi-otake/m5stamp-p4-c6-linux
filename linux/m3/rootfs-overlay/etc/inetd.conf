# NOMMU Dropbear runs once per connection under BusyBox inetd.
# S85easystick-ssh starts inetd only after a writable config mount and an
# authorized key have been provisioned.  The host key is per-device.
22 stream tcp nowait root /usr/sbin/dropbear dropbear -i -w -s -r /config/easystick/dropbear/dropbear_ed25519_host_key
