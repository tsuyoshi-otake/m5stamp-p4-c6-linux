# M3-lab only.  BusyBox inetd starts one Dropbear per connection.
# nowait.N is not a concurrency cap: BusyBox inetd counts connections per
# minute and, at the Nth within 60 s, drops it and stops listening for 60 s.
# nowait.3 let only two SSH connections a minute through (#25), so allow 20;
# concurrent sessions are bounded by memory (a Dropbear exec fails cleanly).
# -g disallows root password login (root is reachable by key only, like
# Debian's PermitRootLogin prohibit-password; #37) and -r points at a
# volatile host key generated once by S85easystick-ssh.
# easystick-sys -u clears PF_EASYSTICK_SYSTEM on each per-connection handler
# (#50): inetd may carry the flag (e.g. a user-started S85 restart re-execs
# through easystick-sys), and it is fork-inherited -- without the clear, SSH
# sessions would classify system-side and bypass the pool's user gate.  On
# kernels without the flag the prctl fails and dropbear still runs.
22 stream tcp nowait.20 root /usr/sbin/easystick-sys easystick-sys -u /usr/sbin/dropbear -i -g -r /run/dropbear_ed25519_host_key
