# EasyStick Stamp-P4 P1 is a temporary control image.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_STA=y
CONFIG_WIFI_ESP_HOSTED_MCU=y

# ESP-Hosted-MCU source 3f0d107 reports v2.12.12.
CONFIG_ESP_HOSTED_MCU_FW_VERSION_MAJOR=2
CONFIG_ESP_HOSTED_MCU_FW_VERSION_MINOR=12
CONFIG_ESP_HOSTED_MCU_FW_VERSION_PATCH=12
CONFIG_ESP_HOSTED_MCU_P1_TRANSPORT_TEST=y
CONFIG_ESP_HOSTED_MCU_LOG_LEVEL_INF=y

# IPv4/DHCP/ICMP are the only network functions needed by P1.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Leave enough room for Wi-Fi RPC events and 1500-byte data frames.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=32

# USB Serial/JTAG is the Function-EV board's selected console. The transport
# driver runs before the shell backend (priority 85 vs 90), so retain its
# startup markers until the shell can emit them.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_EARLY_CONSOLE=y
